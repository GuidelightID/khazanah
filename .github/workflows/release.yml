# Publishes the public @guidelight/* packages to npmjs.com with Changesets.
#
# On every push to main:
#   - pending changesets  -> opens/updates a "chore: release packages" PR that
#                            bumps versions and writes CHANGELOGs
#   - that PR is merged   -> publishes every package whose new version is not
#                            on npm yet (with npm provenance)
#
# Requires the NPM_TOKEN repository secret (an npm automation/granular token
# with publish rights on the @guidelight scope). Packages marked
# "private": true (the examples) are
# never published.
name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Uses package.json "packageManager" (pnpm@9.15.0) — do not also set version.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Quality gate before anything ships.
      - run: pnpm typecheck
      - run: pnpm test

      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "chore: release packages"
          commit: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
