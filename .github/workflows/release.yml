# Publishes the public @guidelight.id/* packages to npmjs.com.
#
# On every push to main:
#   - pending changesets  -> opens/updates a "chore: release packages" PR that
#                            bumps versions and writes CHANGELOGs
#   - that PR is merged   -> scripts/publish.mjs publishes every public package
#                            whose new version is not on npm yet
#
# Authentication is npm trusted publishing (OIDC): no npm token is stored.
# Each package must list this repository and this workflow file (release.yml)
# as a trusted publisher on npmjs.com; see docs/releasing.md. Provenance is
# added automatically. Packages marked "private": true are never published.
name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Uses package.json "packageManager" (pnpm@9.15.0) — do not also set version.
      - uses: pnpm/action-setup@v6

      # Node 24 ships npm 11, which trusted publishing requires (>= 11.5.1).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: npm --version

      - run: pnpm install --frozen-lockfile

      # Quality gate before anything ships.
      - run: pnpm typecheck
      - run: pnpm test

      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "chore: release packages"
          commit: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
