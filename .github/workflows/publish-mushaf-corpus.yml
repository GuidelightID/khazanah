# Menerbitkan @guidelightid/mushaf-corpus ke GitHub Packages.
#
# Dipicu tag `mushaf-corpus-v*` (mis. mushaf-corpus-v0.1.0), bukan setiap push ke main:
# repo ini berisi banyak paket, dan versi paket ini harus naik dengan sengaja.
# GITHUB_TOKEN bawaan sudah cukup — tidak perlu PAT — selama job punya izin
# `packages: write`.
name: Publish @guidelightid/mushaf-corpus

on:
  push:
    tags:
      - 'mushaf-corpus-v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@guidelightid'

      - run: pnpm install --frozen-lockfile

      # Gerbang mutu: paket ini memuat teks Al-Qur'an, jadi tesnya wajib hijau
      # sebelum apa pun terbit.
      - run: pnpm --filter @guidelightid/mushaf-corpus typecheck
      - run: pnpm --filter @guidelightid/mushaf-corpus test
      - run: pnpm --filter @guidelightid/mushaf-corpus build

      - name: Pastikan versi paket cocok dengan tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#mushaf-corpus-v}"
          PKG_VERSION="$(node -p "require('./packages/mushaf-corpus/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME tidak cocok dengan versi paket $PKG_VERSION" >&2
            exit 1
          fi

      - name: Publish
        run: pnpm --filter @guidelightid/mushaf-corpus publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
