# Publishes @guidelightid/mushaf-corpus to GitHub Packages.
#
# Triggered by a `mushaf-corpus-v*` tag (e.g. mushaf-corpus-v0.1.0), not by every
# push to main: this repo holds many packages, and this one's version should only
# move deliberately. The default GITHUB_TOKEN is enough — no PAT needed — as long
# as the job has `packages: write`.
name: Publish @guidelightid/mushaf-corpus

on:
  push:
    tags:
      - 'mushaf-corpus-v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@guidelightid'

      - run: pnpm install --frozen-lockfile

      # Quality gate: this package carries Quran text, so its tests must be green
      # before anything ships.
      - run: pnpm --filter @guidelightid/mushaf-corpus typecheck
      - run: pnpm --filter @guidelightid/mushaf-corpus test
      - run: pnpm --filter @guidelightid/mushaf-corpus build

      - name: Ensure the package version matches the tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#mushaf-corpus-v}"
          PKG_VERSION="$(node -p "require('./packages/mushaf-corpus/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME says $TAG_VERSION but packages/mushaf-corpus/package.json says $PKG_VERSION." >&2
            echo "" >&2
            echo "The tag must be created AFTER the version bump is committed, and must" >&2
            echo "match it exactly. To fix, from a clean tree on main:" >&2
            echo "" >&2
            echo "  git tag -d $GITHUB_REF_NAME" >&2
            echo "  git push origin :refs/tags/$GITHUB_REF_NAME" >&2
            echo "  # then either tag the version that is actually committed:" >&2
            echo "  git tag mushaf-corpus-v$PKG_VERSION && git push origin mushaf-corpus-v$PKG_VERSION" >&2
            echo "  # or bump, commit, and tag in one step, which cannot disagree:" >&2
            echo "  cd packages/mushaf-corpus && npm version $TAG_VERSION --tag-version-prefix=mushaf-corpus-v" >&2
            echo "  git push --follow-tags" >&2
            exit 1
          fi

      - name: Publish
        run: pnpm --filter @guidelightid/mushaf-corpus publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
